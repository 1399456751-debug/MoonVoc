# MoonVoc beta0.5 macOS universal build (VST3 + Standalone)
# Unsigned build: free GitHub Actions cannot Apple-sign plugins
name: Build MoonVoc macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 9.0.0
        run: |
          git clone --depth 1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_ROOT="$RUNNER_TEMP/JUCE" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build plugin
        run: cmake --build build --target MoonVoc --parallel

      - name: Package zip
        run: |
          mkdir -p dist/MoonVoc_beta0.5_Mac
          cp -R build/MoonVoc_artefacts/Release/VST3/MoonVoc.vst3 dist/MoonVoc_beta0.5_Mac/
          cp -R build/MoonVoc_artefacts/Release/Standalone/MoonVoc.app dist/MoonVoc_beta0.5_Mac/
          cat > dist/MoonVoc_beta0.5_Mac/README_Install.txt <<'EOF'
MoonVoc beta 0.5 - macOS
========================

This is an UNSIGNED build (free GitHub Actions, no Apple developer signing).

Contains:
  - MoonVoc.vst3  (VST3 plugin)
  - MoonVoc.app   (standalone)

Install VST3:
  Copy MoonVoc.vst3 to  ~/Library/Audio/Plug-Ins/VST3/
  Rescan plugins in your DAW (REAPER / Studio One / Cubase / FL Studio ...).

First load (unsigned warning):
  Right-click MoonVoc.vst3 (or MoonVoc.app) in Finder -> Open, confirm once;
  or run in Terminal:
    xattr -cr ~/Library/Audio/Plug-Ins/VST3/MoonVoc.vst3

No AU format (AU requires Apple signing; free CI cannot provide it).

TUJZMIXING / MoonVoc 0.5.0
EOF
          cd dist && zip -qr ../MoonVoc_beta0.5_MacUniversal.zip MoonVoc_beta0.5_Mac

      - uses: actions/upload-artifact@v4
        with:
          name: MoonVoc_beta0.5_MacUniversal
          path: MoonVoc_beta0.5_MacUniversal.zip
          retention-days: 30
