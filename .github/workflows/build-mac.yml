name: build-mac
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone JUCE 9.0.0
        run: git clone --depth 1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -DJUCE_ROOT="$RUNNER_TEMP/JUCE" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build plugin
        run: cmake --build build --config Release --target MoonVoc_All -j 4

      - name: Diagnose AU bundle
        run: |
          AU="build/MoonVoc_artefacts/Release/AU/MoonVoc.component"
          echo "=== codesign 状态 ==="
          codesign -dv --verbose=4 "$AU" 2>&1 || true
          codesign -dv --verbose=4 "$AU/Contents/MacOS/MoonVoc" 2>&1 || true
          echo "=== 工厂函数符号 ==="
          nm -gU "$AU/Contents/MacOS/MoonVoc" 2>/dev/null | grep -i factory | head
          echo "=== plist 关键项 ==="
          /usr/libexec/PlistBuddy -c "Print :AudioComponents:0:factoryFunction" "$AU/Contents/Info.plist" || true
          echo "=== 二进制架构 ==="
          lipo -info "$AU/Contents/MacOS/MoonVoc" || true

      - name: Force ad-hoc sign + validate AU (auval)
        run: |
          AU="build/MoonVoc_artefacts/Release/AU/MoonVoc.component"
          codesign --force --deep --sign - "$AU" || true
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/MoonVoc.component
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          xattr -cr ~/Library/Audio/Plug-Ins/Components/MoonVoc.component
          sleep 3
          echo "=== auval -a 列表里是否有 MoonVoc ==="
          auval -a 2>/dev/null | grep -i moonvoc || echo "(未列出)"
          echo "=== 正式验证 ==="
          auval -v aufx MoVc Tujm

      - name: Package VST3 + AU + Standalone
        run: |
          mkdir -p dist/MoonVoc_mac
          cp -R "build/MoonVoc_artefacts/Release/VST3/MoonVoc.vst3" dist/MoonVoc_mac/
          cp -R "build/MoonVoc_artefacts/Release/AU/MoonVoc.component" dist/MoonVoc_mac/
          cp -R "build/MoonVoc_artefacts/Release/Standalone/MoonVoc.app" dist/MoonVoc_mac/
          cp README_Mac.txt dist/MoonVoc_mac/
          cd dist && ditto -c -k MoonVoc_mac MoonVoc_0.7.0_mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MoonVoc_0.7.0_mac
          path: dist/MoonVoc_0.7.0_mac.zip
